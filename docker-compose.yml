services:
  cascade:
    # To update Cascade, change this exact release tag, then run:
    # docker compose pull && docker compose up -d
    image: ghcr.io/alexnikon/cascade:0.9.5
    container_name: cascade
    restart: unless-stopped

    # Load deploy config from .env (setup.sh writes here).
    # Variables defined here override the defaults in environment: below.
    env_file:
      - path: .env
        required: false   # OK if file doesn't exist (first run without setup.sh)

    # All runtime config comes from .env (written by setup.sh / switch-mode.sh).
    # Do not add WG_HOST, PORT, or BIND_ADDR here — they live in .env
    # so that deployment bundle updates never conflict with local changes.
    environment:
      # Default WireGuard/AWG listen port (UDP) — used when creating interfaces.
      # Override in .env if needed.
      - WG_PORT=51820

      # Debug logging — set to false in production
      - DEBUG=false

      # ================================================================
      # NOTE: Versioned AmneziaWG parameters, including AWG 3.1 fields,
      # are managed in the Web UI and stored in the Cascade database.
      # Environment variables are not used for per-interface AWG parameters.
      # ================================================================

    volumes:
      - ./data:/etc/wireguard/data
      # Mount host /etc/hostname read-only so the app can display the real
      # server hostname (os.Hostname() inside Docker returns a container hash).
      - /etc/hostname:/host_hostname:ro

    # --network host: container shares host network namespace.
    # Required for WireGuard/AWG tunnel interfaces and iptables management.
    # ip_forward and src_valid_mark are enabled automatically by entrypoint.sh.
    network_mode: host

    cap_add:
      - NET_ADMIN
      # SYS_MODULE is only required for kernel module mode (AWG_USERSPACE_IMPL="").
      # In userspace mode (AWG_USERSPACE_IMPL=amneziawg-go) it can be omitted.
      # Kept here for compatibility — harmless when kernel module is not used.
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun
