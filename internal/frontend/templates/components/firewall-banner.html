[[ define "firewall-banner" ]]
        <!-- Firewall pending changes global banner -->
        <div v-if="firewallPending && activePage !== 'firewall'" class="firewall-pending-banner firewall-pending-notice" role="status"
          @click="activePage = 'firewall'">
          <span style="font-size:1rem;">⚠️</span>
          <span class="firewall-pending-message">
            <strong>Unapplied firewall changes</strong> — click to go to Firewall Rules and apply.
          </span>
          <span class="firewall-pending-link">Go to Firewall →</span>
        </div>


[[ end ]]
