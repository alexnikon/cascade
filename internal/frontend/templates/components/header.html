[[ define "header" ]]
<main class="flex-grow app-main" :class="{ 'mobile-nav-open': mobileNavOpen, 'dashboard-active': activePage === 'dashboard', 'section-layout': !isWizardPage }">
          <header v-if="isWizardPage" class="mobile-app-header">
            <button ref="mobileMenuButton" type="button" class="mobile-menu-button"
              aria-label="Open navigation" aria-controls="app-navigation"
              :aria-expanded="String(mobileNavOpen)" @click="openMobileNav()">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            </button>
            <div style="min-width:0;">
              <div class="text-xs text-gray-500 dark:text-neutral-400 truncate">{{ activeServerLabel }}</div>
              <div class="font-semibold dark:text-neutral-100 truncate">{{ activePage === 'dashboard' ? 'Cascade' : activePageLabel }}</div>
            </div>
          </header>

<header v-if="!isWizardPage" class="section-toolbar">
  <div class="section-toolbar-row">
            <button ref="mobileMenuButton" type="button" class="mobile-menu-button"
              aria-label="Open navigation" aria-controls="app-navigation"
              :aria-expanded="String(mobileNavOpen)" @click="openMobileNav()">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            </button>

    <div class="section-toolbar-heading">
      <div class="section-server-label text-xs text-gray-500 dark:text-neutral-400 truncate">{{ activeServerLabel }}</div>
      <h1 class="section-title dark:text-neutral-200">{{ sectionTitle }}</h1>
    </div>
    <div v-if="activePage !== 'settings' && !(activePage === 'routing' && activeRoutingTab !== 'static') && !(activePage === 'diagnostics' && diagActiveTab !== 'graphs')" class="section-toolbar-controls">
<div v-if="activePage === 'dashboard'" class="section-toolbar-actions"><div class="dashboard-toolbar flex items-center justify-between">

            <div class="flex gap-2">
              <!-- Add Widget dropdown -->
              <div style="position:relative;">
                <button @click="dashShowAddMenu = !dashShowAddMenu"
                  class="flex items-center gap-2 text-white rounded-lg text-sm font-medium"
                  style="padding:7px 12px; background:#4f46e5; border:none; cursor:pointer;">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  Add Widget
                </button>
                <div v-if="dashShowAddMenu"
                  @click.self="dashShowAddMenu = false"
                  class="bg-white dark:bg-neutral-700 rounded-lg shadow-lg"
                  style="position:absolute; right:0; top:calc(100% + 6px); width:220px; z-index:100; border:1px solid #e5e7eb;">
                  <div v-for="wt in dashAvailableWidgetTypes" :key="wt.type"
                    @click="dashAddWidget(wt.type); dashShowAddMenu = false"
                    class="flex items-center gap-3 text-sm dark:text-neutral-200 cursor-pointer"
                    style="padding:10px 14px; border-bottom:1px solid #f3f4f6;"
                    :style="{ 'border-bottom-color': theme === 'dark' ? '#525252' : '#f3f4f6' }"
                    @mouseenter="$event.currentTarget.style.background = theme==='dark'?'#525252':'#f9fafb'"
                    @mouseleave="$event.currentTarget.style.background = 'transparent'">
                    <span style="font-size:1.1rem;">{{ wt.icon }}</span>
                    <span>{{ wt.label }}</span>
                  </div>
                </div>
              </div>
              <button @click="dashResetLayout"
                class="px-3 py-2 border border-gray-300 dark:border-neutral-500 rounded-lg text-sm dark:text-neutral-200 transition"
                title="Reset to default layout">
                Reset
              </button>
            </div>
          </div>
</div>
<div v-if="activePage === 'interfaces'" class="section-toolbar-actions"><div class="flex gap-2" style="margin-bottom:10px;">
			<button @click="_resetInterfaceCreate(); showInterfaceCreate = true; generateAndFillInterfaceParams()"
			  class="btn flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium transition"
              :style="{ background: theme === 'dark' ? '#15803d' : '#16a34a', color: 'white' }"
              title="Create new interface">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
              </svg>
              New
            </button>
            <button @click="showImportBackup = true; importBackupTab = 'cascade'; importBackupForm = { json: '', listenPort: '', fileName: '' }"
			  class="btn interface-import-button flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium transition"
              title="Import a Cascade interface export or WG/AWG configuration">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>
              </svg>
              Import
            </button>
          </div>
</div>
<div v-if="activePage === 'gateways'" class="section-toolbar-actions"><button @click="showGatewayCreate = true"
                class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded text-sm font-medium transition">
                + New Gateway
              </button>
</div>
<div v-if="activePage === 'gateways'" class="section-toolbar-actions"><button @click="showGroupCreate = true"
                class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded text-sm font-medium transition">
                + New Group
              </button>
</div>
<div v-if="activePage === 'firewall-aliases'" class="section-toolbar-actions"><button @click="showAliasCreate = true; _resetAliasCreate()"
              class="bg-blue-600 text-white rounded-lg font-medium text-sm transition btn">
              + Add Alias
            </button>
</div>
<div v-if="activePage === 'routing' && activeRoutingTab === 'static'" class="section-toolbar-actions"><button @click="showRouteCreate = true"
                class="px-4 py-2 bg-green-600 text-white rounded text-sm font-medium transition">
                + Add Route
              </button>
</div>
<div v-if="activePage === 'nat' && activeNatTab === 'outbound'" class="section-toolbar-actions"><button @click="showNatRuleCreate = true; loadNatInterfaces()"
                class="px-4 py-2 bg-green-600 text-white rounded text-sm font-medium transition">
                + Add Rule
              </button>
</div>
<div v-if="activePage === 'nat' && activeNatTab === 'portforward'" class="section-toolbar-actions"><button @click="openAddDnat()"
                  class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg"
                  style="padding:8px 16px;">
                  + Add Rule
                </button>
</div>
<div v-if="activePage === 'diagnostics'" class="section-toolbar-actions"><button v-if="diagActiveTab === 'graphs'" @click="diagAddWidget()"
              class="text-sm text-white rounded"
              style="padding:7px 16px; background:#2563eb; border:none; cursor:pointer;">
              + Add Graph
            </button>
</div>
<div v-if="activePage === 'remotes'" class="section-toolbar-actions"><div style="display:flex; gap:8px;">
              <button @click="openSpeedtest()" :disabled="remotes.length === 0"
                class="rounded-lg font-medium text-sm btn"
                :style="remotes.length === 0 ? 'background:#e5e7eb; color:#9ca3af; cursor:not-allowed; padding:8px 16px;' : 'background:#f3f4f6; color:#374151; padding:8px 16px;'">
                ⚡ Speed Test
              </button>
              <button @click="showRemoteAdd = true"
                class="text-white rounded-lg font-medium text-sm btn"
                style="background:#2563eb; padding:8px 16px; white-space:nowrap;">
                + Add Server
              </button>
            </div>
</div>
<div v-if="activePage === 'administration'" class="section-toolbar-actions"><div class="flex md:block md:flex-shrink-0">
              <!-- Restore configuration -->
              <label for="inputRC" :title="$t('titleRestoreConfig')"
                class="hover:cursor-pointer hover:bg-red-800 hover:border-red-800 hover:text-white text-gray-700 dark:text-neutral-200 max-md:border-r-0 border-2 border-gray-100 dark:border-neutral-600 py-2 px-4 rounded-l-full md:rounded inline-flex items-center transition">
                <svg inline class="w-4 md:mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"></path>
                </svg>
                <span class="max-md:hidden text-sm">{{$t("restore")}}</span>
                <input id="inputRC" type="file" name="configurationfile" accept="text/*,.json" @change="restoreConfig" class="hidden"/>
              </label>
              <!-- Backup configuration -->
              <a href="./api/wireguard/backup" :title="$t('titleBackupConfig')"
                class="hover:bg-red-800 hover:border-red-800 hover:text-white text-gray-700 dark:text-neutral-200 max-md:border-x-0 border-2 border-gray-100 dark:border-neutral-600 py-2 px-4 md:rounded inline-flex items-center transition">
                <svg inline class="w-4 md:mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3m3 3a3 3 0 1 0 0 6h13.5a3 3 0 1 0 0-6m-16.5-3a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3m-19.5 0a4.5 4.5 0 0 1 .9-2.7L5.737 5.1a3.375 3.375 0 0 1 2.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 0 1 .9 2.7m0 0a3 3 0 0 1-3 3m0 3h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Zm-3 6h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Z"></path>
                </svg>
                <span class="max-md:hidden text-sm">{{$t("backup")}}</span>
              </a>
              <!-- Sort client -->
              <button v-if="enableSortClient" @click="sortClient = !sortClient;"
                      class="hover:bg-red-800 hover:border-red-800 hover:text-white text-gray-700 dark:text-neutral-200 max-md:border-x-0 border-2 border-gray-100 dark:border-neutral-600 py-2 px-4 md:rounded inline-flex items-center transition">
                  <svg v-if="sortClient === true" inline class="w-4 md:mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path d="M12 19.75C11.9015 19.7504 11.8038 19.7312 11.7128 19.6934C11.6218 19.6557 11.5392 19.6001 11.47 19.53L5.47 13.53C5.33752 13.3878 5.2654 13.1997 5.26882 13.0054C5.27225 12.8111 5.35096 12.6258 5.48838 12.4883C5.62579 12.3509 5.81118 12.2722 6.00548 12.2688C6.19978 12.2654 6.38782 12.3375 6.53 12.47L12 17.94L17.47 12.47C17.6122 12.3375 17.8002 12.2654 17.9945 12.2688C18.1888 12.2722 18.3742 12.3509 18.5116 12.4883C18.649 12.6258 18.7277 12.8111 18.7312 13.0054C18.7346 13.1997 18.6625 13.3878 18.53 13.53L12.53 19.53C12.4608 19.6001 12.3782 19.6557 12.2872 19.6934C12.1962 19.7312 12.0985 19.7504 12 19.75Z" fill="#000000"/>
                    <path d="M12 19.75C11.8019 19.7474 11.6126 19.6676 11.4725 19.5275C11.3324 19.3874 11.2526 19.1981 11.25 19V5C11.25 4.80109 11.329 4.61032 11.4697 4.46967C11.6103 4.32902 11.8011 4.25 12 4.25C12.1989 4.25 12.3897 4.32902 12.5303 4.46967C12.671 4.61032 12.75 4.80109 12.75 5V19C12.7474 19.1981 12.6676 19.3874 12.5275 19.5275C12.3874 19.6676 12.1981 19.7474 12 19.75Z" fill="#000000"/>
                  </svg>
                  <svg v-if="sortClient === false" inline class="w-4 md:mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path d="M18 11.75C17.9015 11.7505 17.8038 11.7313 17.7128 11.6935C17.6218 11.6557 17.5392 11.6001 17.47 11.53L12 6.06001L6.53 11.53C6.38782 11.6625 6.19978 11.7346 6.00548 11.7312C5.81118 11.7278 5.62579 11.649 5.48838 11.5116C5.35096 11.3742 5.27225 11.1888 5.26882 10.9945C5.2654 10.8002 5.33752 10.6122 5.47 10.47L11.47 4.47001C11.6106 4.32956 11.8012 4.25067 12 4.25067C12.1987 4.25067 12.3894 4.32956 12.53 4.47001L18.53 10.47C18.6705 10.6106 18.7493 10.8013 18.7493 11C18.7493 11.1988 18.6705 11.3894 18.53 11.53C18.4608 11.6001 18.3782 11.6557 18.2872 11.6935C18.1962 11.7313 18.0985 11.7505 18 11.75Z" fill="#000000"/>
                    <path d="M12 19.75C11.8019 19.7474 11.6126 19.6676 11.4725 19.5275C11.3324 19.3874 11.2526 19.1981 11.25 19V5C11.25 4.80109 11.329 4.61032 11.4697 4.46967C11.6103 4.32902 11.8011 4.25 12 4.25C12.1989 4.25 12.3897 4.32902 12.5303 4.46967C12.671 4.61032 12.75 4.80109 12.75 5V19C12.7474 19.1981 12.6676 19.3874 12.5275 19.5275C12.3874 19.6676 12.1981 19.7474 12 19.75Z" fill="#000000"/>
                  </svg>
                  <span class="max-md:hidden text-sm">{{$t("sort")}}</span>
              </button>

              <!-- New client -->
              <button @click="clientCreate = true; clientCreateName = ''; clientExpiredDate = '';"
                class="hover:bg-red-800 hover:border-red-800 hover:text-white text-gray-700 dark:text-neutral-200 max-md:border-l-0 border-2 border-gray-100 dark:border-neutral-600 py-2 px-4 rounded-r-full md:rounded inline-flex items-center transition">
                <svg class="w-4 md:mr-2" inline xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                <span class="max-md:hidden text-sm">{{$t("new")}}</span>
              </button>
            </div>
</div>
[[ template "firewall-toolbar" . ]]
    </div>
  </div>
<div class="section-toolbar-tabs" v-if="activePage === 'interfaces'">
            <!-- "All" dashboard tab: selected when no interface is active -->
            <button @click="activeInterfaceId = null"
              class="interface-filter-button px-4 py-2 font-medium transition text-sm"
              :style="!activeInterfaceId
                ? 'background:#2563eb; color:white; border:none;'
                : theme==='dark'
                  ? 'background:#404040; color:#e5e5e5; border:1px solid #525252;'
                  : 'background:#f3f4f6; color:#111827; border:1px solid #d1d5db;'">
              All
            </button>
            <button v-for="iface in tunnelInterfaces" :key="iface.id"
              @click="activeInterfaceId = iface.id"
              class="interface-filter-button px-4 py-2 font-medium transition text-sm"
              :style="activeInterfaceId === iface.id
                ? 'background:#16a34a; color:white; border:none;'
                : theme==='dark'
                  ? 'background:#404040; color:#e5e5e5; border:1px solid #525252;'
                  : 'background:#f3f4f6; color:#111827; border:1px solid #d1d5db;'">
              {{ iface.name || iface.id }}
            </button>
          </div>
<div class="section-toolbar-tabs" v-if="activePage === 'routing'">
            <button @click="switchRoutingTab('status')"
              :class="activeRoutingTab === 'status' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-neutral-600 text-gray-700 dark:text-neutral-200'"
              class="px-4 py-2 rounded-lg font-medium transition text-sm">
              Status
            </button>
            <button @click="switchRoutingTab('static')"
              :class="activeRoutingTab === 'static' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-neutral-600 text-gray-700 dark:text-neutral-200'"
              class="px-4 py-2 rounded-lg font-medium transition text-sm">
              Static
            </button>
            <button @click="switchRoutingTab('ospf')"
              class="px-4 py-2 rounded-lg font-medium transition text-sm bg-gray-200 dark:bg-neutral-600 text-gray-700 dark:text-neutral-200"
              style="opacity:0.5; cursor:not-allowed;" disabled>
              OSPF
            </button>
          </div>
<div class="section-toolbar-tabs" v-if="activePage === 'nat'">
            <button @click="switchNatTab('outbound')"
              :class="activeNatTab === 'outbound' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-neutral-600 text-gray-700 dark:text-neutral-200'"
              class="px-4 py-2 rounded-lg font-medium transition text-sm">
              Outbound NAT
            </button>
            <button @click="switchNatTab('portforward')"
              :class="activeNatTab === 'portforward' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-neutral-600 text-gray-700 dark:text-neutral-200'"
              class="px-4 py-2 rounded-lg font-medium transition text-sm">
              Port Forwarding
            </button>
          </div>
<div class="section-toolbar-tabs" v-if="activePage === 'administration'">
            <button class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium text-sm">
              Admin Tunnel
            </button>
          </div>
<div class="section-toolbar-tabs" v-if="activePage === 'diagnostics'">
            <button @click="diagActiveTab='graphs'" class="ui-tab-button"
              style="padding:7px 18px; border:none; cursor:pointer; font-size:0.875rem; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-2px; background:none;"
              :style="{ color: diagActiveTab==='graphs' ? (theme==='dark'?'#60a5fa':'#2563eb') : (theme==='dark'?'#a3a3a3':'#6b7280'), borderBottomColor: diagActiveTab==='graphs' ? (theme==='dark'?'#60a5fa':'#2563eb') : 'transparent' }">
              Graphs
            </button>
            <button @click="diagActiveTab='utilities'" class="ui-tab-button"
              style="padding:7px 18px; border:none; cursor:pointer; font-size:0.875rem; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-2px; background:none;"
              :style="{ color: diagActiveTab==='utilities' ? (theme==='dark'?'#60a5fa':'#2563eb') : (theme==='dark'?'#a3a3a3':'#6b7280'), borderBottomColor: diagActiveTab==='utilities' ? (theme==='dark'?'#60a5fa':'#2563eb') : 'transparent' }">
              Utilities
            </button>
          </div>
</header>
<div class="app-main-content" :class="{ 'dashboard-main-content': activePage === 'dashboard' }">
[[ end ]]
