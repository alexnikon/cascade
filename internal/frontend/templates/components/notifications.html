[[ define "notifications" ]]
    <!-- ==================== Toast Notifications ==================== -->
    <div class="toast-container" style="position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; width:360px; max-width:calc(100vw - 32px);">
      <transition-group name="toast">
        <div v-for="toast in toasts" :key="toast.id"
          class="rounded-lg text-sm"
          :class="theme === 'dark' ? (toast.type === 'error' ? 'toast-error' : 'toast-success') : ''"
          style="pointer-events:auto; padding:14px 16px; display:flex; align-items:flex-start; gap:10px; color:#fff; box-shadow:0 4px 16px rgba(0,0,0,0.35);"
          :style="{ background: toast.type === 'error' ? 'rgba(220,38,38,0.88)' : 'rgba(22,163,74,0.88)' }">
          <!-- Icon -->
          <svg v-if="toast.type !== 'error'" style="flex-shrink:0; margin-top:1px;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          <svg v-else style="flex-shrink:0; margin-top:1px;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="9"/>
            <path stroke-linecap="round" d="M12 7.5v6M12 17h.01"/>
          </svg>
          <!-- Message -->
          <span style="flex:1; line-height:1.45; word-break:break-word;">{{ toast.message }}</span>
          <!-- Dismiss button -->
          <button @click="dismissToast(toast.id)"
            style="flex-shrink:0; background:none; border:none; padding:0; cursor:pointer; color:rgba(255,255,255,0.9); font-size:18px; line-height:1; margin-top:-1px;"
            title="Dismiss">×</button>
        </div>
      </transition-group>
    </div>

    </div>

[[ end ]]
