[[ define "notifications" ]]
    <div class="toast-container">
      <transition-group tag="div" name="toast" class="toast-stack">
        <div v-for="toast in toasts" :key="toast.id" class="toast-card"
          :data-tone="toast.type"
          :style="toast.duration > 0 ? { '--toast-duration': toast.duration + 'ms' } : null">
          <span class="toast-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path v-if="toast.type === 'error'" d="M12 6v7m0 4h.01"/>
              <path v-else-if="toast.type === 'success'" d="m5 12 4 4L19 6"/>
              <path v-else d="M12 7h.01M12 11v6"/>
            </svg>
          </span>
          <span class="toast-message" :role="toast.type === 'error' ? 'alert' : 'status'"
            :aria-live="toast.type === 'error' ? 'assertive' : 'polite'">{{ toast.message }}</span>
          <button type="button" class="toast-dismiss" @click="dismissToast(toast.id)" aria-label="Dismiss notification">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="m6 6 12 12M18 6 6 18"/>
            </svg>
          </button>
          <span v-if="toast.duration > 0" class="toast-progress" aria-hidden="true"></span>
        </div>
      </transition-group>
    </div>

    </div>

[[ end ]]
