[[ define "dashboard" ]]
        <!-- ============================================================== -->
        <!-- Dashboard Page                                                 -->
        <!-- ============================================================== -->
        <div v-if="activePage === 'dashboard'" key="page-dashboard" class="dashboard-page">
          <!-- Toolbar -->
          <div class="dashboard-toolbar flex items-center justify-between">
            <h1 class="text-xl font-semibold dark:text-neutral-100">Dashboard</h1>
            <div class="flex gap-2">
              <!-- Add Widget dropdown -->
              <div style="position:relative;">
                <button @click="dashShowAddMenu = !dashShowAddMenu"
                  class="flex items-center gap-2 text-white rounded-lg text-sm font-medium"
                  style="padding:7px 12px; background:#4f46e5; border:none; cursor:pointer;">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  Add Widget
                </button>
                <div v-if="dashShowAddMenu"
                  @click.self="dashShowAddMenu = false"
                  class="bg-white dark:bg-neutral-700 rounded-lg shadow-lg"
                  style="position:absolute; right:0; top:calc(100% + 6px); width:220px; z-index:100; border:1px solid #e5e7eb;">
                  <div v-for="wt in dashAvailableWidgetTypes" :key="wt.type"
                    @click="dashAddWidget(wt.type); dashShowAddMenu = false"
                    class="flex items-center gap-3 text-sm dark:text-neutral-200 cursor-pointer"
                    style="padding:10px 14px; border-bottom:1px solid #f3f4f6;"
                    :style="{ 'border-bottom-color': theme === 'dark' ? '#525252' : '#f3f4f6' }"
                    @mouseenter="$event.currentTarget.style.background = theme==='dark'?'#525252':'#f9fafb'"
                    @mouseleave="$event.currentTarget.style.background = 'transparent'">
                    <span style="font-size:1.1rem;">{{ wt.icon }}</span>
                    <span>{{ wt.label }}</span>
                  </div>
                </div>
              </div>
              <button @click="dashResetLayout"
                class="px-3 py-2 border border-gray-300 dark:border-neutral-500 rounded-lg text-sm dark:text-neutral-200 transition"
                title="Reset to default layout">
                Reset
              </button>
            </div>
          </div>

          <div class="dashboard-scroll">
          <!-- GridStack container — Vue renders items directly here; GridStack adopts them -->
          <div class="grid-stack" id="dashboard-grid">
            <div v-for="w in dashWidgets" :key="w.id"
              class="grid-stack-item"
              :gs-id="w.id" :gs-x="w.x" :gs-y="w.y" :gs-w="w.w" :gs-h="w.h"
              gs-min-w="2" gs-min-h="2">
              <div class="grid-stack-item-content">
                <div class="dash-card">
                  <div class="dash-card-header">
                    <span>{{ (w.type === 'monitoring' && w.title) ? w.title : dashWidgetLabel(w.type) }}</span>
                    <div style="display:flex; align-items:center; gap:4px;">
                      <template v-if="w.type === 'monitoring'">
                        <select :value="metricsWidgetPeriod[w.id]||'5m'" @change="metricsOnPeriodChange(w.id, $event.target.value)"
                          class="text-xs dark:text-neutral-300 rounded"
                          style="padding:1px 4px; border:1px solid transparent; cursor:pointer; background:none; opacity:0.7;"
                          :style="{ color: theme==='dark'?'#d4d4d4':'#374151' }">
                          <option value="5m">5m</option>
                          <option value="1h">1h</option>
                          <option value="6h">6h</option>
                          <option value="24h">24h</option>
                          <option value="7d">7d</option>
                          <option value="30d">30d</option>
                        </select>
                        <button @click="metricsOpenConfig(w.id)" title="Configure graphs"
                          style="opacity:0.6; background:none; border:none; cursor:pointer; padding:0 3px; line-height:1; color:inherit; font-size:0.85rem;">⚙</button>
                      </template>
                      <template v-if="w.type !== 'monitoring'">
                        <button @click="dashAdjustFontScale(w.id, -0.1)" title="Smaller text"
                          style="opacity:0.55; background:none; border:none; cursor:pointer; padding:0 2px; line-height:1; color:inherit; font-size:0.8rem;">−</button>
                        <span style="opacity:0.4; font-size:0.65rem; min-width:2.2em; text-align:center;">{{ Math.round((w.fontScale||1)*100) }}%</span>
                        <button @click="dashAdjustFontScale(w.id, +0.1)" title="Larger text"
                          style="opacity:0.55; background:none; border:none; cursor:pointer; padding:0 2px; line-height:1; color:inherit; font-size:0.8rem;">+</button>
                      </template>
                      <button @click="dashRemoveWidget(w.id)" title="Remove widget"
                        style="opacity:0.5; background:none; border:none; cursor:pointer; padding:0; line-height:1; color:inherit; margin-left:2px;">✕</button>
                    </div>
                  </div>
                  <div class="dash-card-body">

                    <!-- ── server-info ── -->
                    <template v-if="w.type === 'server-info'">
                      <div v-if="dashSystemInfo" style="display:flex; flex-direction:column; gap:8px;">
                        <div class="flex items-center justify-between text-sm">
                          <span class="text-gray-500 dark:text-neutral-400">Hostname</span>
                          <span class="font-mono font-medium dark:text-neutral-200">{{ dashSystemInfo.hostname }}</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                          <span class="text-gray-500 dark:text-neutral-400">Uptime</span>
                          <span class="font-medium dark:text-neutral-200">{{ dashSystemInfo.uptime }}</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                          <span class="text-gray-500 dark:text-neutral-400">Load avg</span>
                          <span class="font-mono dark:text-neutral-200">{{ dashSystemInfo.load1 }} / {{ dashSystemInfo.load5 }} / {{ dashSystemInfo.load15 }}</span>
                        </div>
                        <div style="margin-top:4px;">
                          <div class="flex items-center justify-between text-sm mb-1">
                            <span class="text-gray-500 dark:text-neutral-400">Memory</span>
                            <span class="dark:text-neutral-200">{{ dashFmtBytes(dashSystemInfo.memUsed * 1024) }} / {{ dashFmtBytes(dashSystemInfo.memTotal * 1024) }} ({{ dashSystemInfo.memPct }}%)</span>
                          </div>
                          <div style="height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden;">
                            <div :style="{ width: dashSystemInfo.memPct + '%', background: dashSystemInfo.memPct > 85 ? '#ef4444' : dashSystemInfo.memPct > 65 ? '#eab308' : '#22c55e', height: '100%', borderRadius: '3px', transition: 'width 0.4s' }"></div>
                          </div>
                        </div>
                      </div>
                      <div v-else class="text-sm text-gray-400 dark:text-neutral-500">Loading…</div>
                    </template>

                    <!-- ── gateways ── -->
                    <template v-else-if="w.type === 'gateways'">
                      <div v-if="gatewaysLoading && !gatewaysLoaded" class="text-sm text-gray-400 dark:text-neutral-500">Loading…</div>
                      <div v-else-if="gatewaysError && !gatewaysLoaded" class="text-sm text-red-600 dark:text-red-400">Unable to load gateways.</div>
                      <div v-else-if="gatewaysLoaded && gateways.length === 0" class="text-sm text-gray-400 dark:text-neutral-500">No gateways</div>
                      <div v-else v-for="gw in gateways" :key="gw.id"
                        class="flex items-center gap-2 text-sm"
                        style="padding:4px 0; border-bottom:1px solid #f3f4f6;"
                        :style="{ 'border-bottom-color': theme === 'dark' ? '#525252' : '#f3f4f6' }">
                        <span @click="toggleGatewayAdminDown(gw)"
                          :title="gw.adminDown ? 'Admin Down — click to bring up' : 'Healthy — click to set Admin Down'"
                          style="width:10px; height:10px; border-radius:50%; cursor:pointer; flex-shrink:0; display:inline-block; transition:background 0.2s;"
                          :style="{
                            background: gatewayStatusColor(gw.status),
                            outline: gw.adminDown && gw.realStatus ? '2px solid ' + gatewayStatusColor(gw.realStatus) : 'none',
                            outlineOffset: '1px'
                          }"></span>
                        <span class="font-medium dark:text-neutral-200 truncate" style="flex:1;">{{ gw.name }}</span>
                        <span class="text-xs font-mono" :style="{ color: gatewayStatusColor(gw.status) }">{{ gatewayStatusLabel(gw.status) }}</span>
                        <span v-if="gw.latency !== null" class="text-xs text-gray-400 dark:text-neutral-500 font-mono">{{ gw.latency }}ms</span>
                      </div>
                    </template>

                    <!-- ── peers-summary ── -->
                    <template v-else-if="w.type === 'peers-summary'">
                      <div style="display:flex; gap:16px; flex-wrap:wrap;">
                        <div style="flex:1; min-width:80px; text-align:center; padding:8px; background:#f9fafb; border-radius:8px;"
                          :style="{ background: theme === 'dark' ? '#525252' : '#f9fafb' }">
                          <div class="text-2xl font-bold dark:text-neutral-100">{{ allPeers.length }}</div>
                          <div class="text-xs text-gray-500 dark:text-neutral-400 mt-1">Total Peers</div>
                        </div>
                        <div style="flex:1; min-width:80px; text-align:center; padding:8px; background:#f9fafb; border-radius:8px;"
                          :style="{ background: theme === 'dark' ? '#525252' : '#f9fafb' }">
                          <div class="text-2xl font-bold" style="color:#22c55e;">{{ allPeers.filter(p => p.latestHandshakeAt && (Date.now() - new Date(p.latestHandshakeAt).getTime()) < 3 * 60 * 1000).length }}</div>
                          <div class="text-xs text-gray-500 dark:text-neutral-400 mt-1">Connected</div>
                        </div>
                        <div style="flex:1; min-width:80px; text-align:center; padding:8px; background:#f9fafb; border-radius:8px;"
                          :style="{ background: theme === 'dark' ? '#525252' : '#f9fafb' }">
                          <div class="text-2xl font-bold dark:text-neutral-100">{{ tunnelInterfaces.length }}</div>
                          <div class="text-xs text-gray-500 dark:text-neutral-400 mt-1">Interfaces</div>
                        </div>
                      </div>
                    </template>

                    <!-- ── interfaces ── -->
                    <template v-else-if="w.type === 'interfaces'">
                      <div v-if="interfacesLoading && !interfacesLoaded" class="text-sm text-gray-400 dark:text-neutral-500">Loading…</div>
                      <div v-else-if="interfacesError && !interfacesLoaded" class="text-sm text-red-600 dark:text-red-400">Unable to load interfaces.</div>
                      <div v-else-if="interfacesLoaded && tunnelInterfaces.length === 0" class="text-sm text-gray-400 dark:text-neutral-500">No interfaces</div>
                      <div v-else v-for="iface in tunnelInterfaces" :key="iface.id"
                        style="padding:5px 0; border-bottom:1px solid #f3f4f6;"
                        :style="{ 'border-bottom-color': theme==='dark'?'#525252':'#f3f4f6' }">

                        <!-- Row 1: status + name + badges -->
                        <div style="display:flex; align-items:center; gap:6px; font-size:0.72rem;">
                          <!-- read-only status dot -->
                          <span :title="iface.enabled ? 'Up' : 'Down'"
                            style="width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block;"
                            :style="{ background: iface.enabled ? '#22c55e' : '#ef4444' }"></span>

                          <!-- name -->
                          <span style="font-weight:600; white-space:nowrap; flex-shrink:0;"
                            :style="{ color: theme==='dark'?'#e5e5e5':'#374151' }">{{ iface.name }}</span>

                          <!-- system id + port -->
                          <span style="font-family:monospace; color:#9ca3af; white-space:nowrap; flex-shrink:0; font-size:0.65rem;">{{ iface.id }}:{{ iface.listenPort }}</span>

                          <!-- S2S badge -->
                          <span v-if="iface.disableRoutes"
                            style="font-size:0.6rem; font-weight:600; padding:1px 4px; background:rgba(59,130,246,0.12); color:#2563eb; border-radius:3px; flex-shrink:0;">S2S</span>

                          <!-- protocol badge -->
                          <span style="font-size:0.6rem; font-weight:600; padding:1px 4px; border-radius:3px; flex-shrink:0;"
                            :style="iface.protocol === 'wireguard-1.0' || iface.protocol === 'wireguard'
                              ? (theme==='dark' ? 'background:rgba(156,163,175,0.15); color:#d1d5db;' : 'background:rgba(107,114,128,0.1); color:#6b7280;')
                              : (theme==='dark' ? 'background:rgba(99,102,241,0.2); color:#a5b4fc;' : 'background:rgba(99,102,241,0.12); color:#6366f1;')">
                            {{ dashProtoLabel(iface.protocol) }}
                          </span>

                          <!-- MTU badge -->
                          <span style="font-size:0.6rem; font-weight:600; padding:1px 4px; border-radius:3px; flex-shrink:0;"
                            :style="{ background: theme==='dark'?'rgba(75,85,99,0.35)':'rgba(107,114,128,0.08)', color: theme==='dark'?'#d1d5db':'#6b7280' }">
                            MTU {{ iface.mtu > 0 ? iface.mtu : (globalSettings.mtu > 0 ? globalSettings.mtu : 'auto') }}
                          </span>

                          <!-- MSS badge (only if not disabled) -->
                          <span v-if="iface.mss !== 0"
                            style="font-size:0.6rem; font-weight:600; padding:1px 4px; border-radius:3px; flex-shrink:0;"
                            :style="{ background: theme==='dark'?'rgba(245,158,11,0.2)':'rgba(245,158,11,0.1)', color: theme==='dark'?'#fbbf24':'#d97706' }">
                            {{ iface.mss === -1 ? 'MSS auto' : 'MSS ' + iface.mss }}
                          </span>

                        </div>

                        <!-- Row 2: address + traffic + peers -->
                        <div style="display:flex; align-items:center; gap:8px; margin-top:2px; padding-left:16px; font-size:0.65rem; font-family:monospace; color:#9ca3af; flex-wrap:wrap;">
                          <span>{{ iface.address }}</span>
                          <span style="color:#ef4444;">↓{{ dashFmtBytes(allPeers.filter(p=>p.interfaceId===iface.id).reduce((s,p)=>s+(p.totalRx||0),0)) }}</span>
                          <span style="color:#22c55e;">↑{{ dashFmtBytes(allPeers.filter(p=>p.interfaceId===iface.id).reduce((s,p)=>s+(p.totalTx||0),0)) }}</span>
                          <span>{{ iface.peerCount||0 }} peers</span>
                        </div>
                      </div>
                    </template>

                    <!-- ── traffic ── -->
                    <template v-else-if="w.type === 'traffic'">
                      <div style="display:flex; gap:16px; flex-wrap:wrap;">
                        <div style="flex:1; min-width:100px; text-align:center; padding:8px; background:#f9fafb; border-radius:8px;"
                          :style="{ background: theme === 'dark' ? '#525252' : '#f9fafb' }">
                          <div class="text-xl font-bold" :style="{ color: theme === 'dark' ? '#fecaca' : '#ef4444' }">{{ dashFmtBytes(allPeers.reduce((s,p) => s + (p.totalRx||0), 0)) }}</div>
                          <div class="text-xs text-gray-500 dark:text-neutral-400 mt-1">Total Received</div>
                        </div>
                        <div style="flex:1; min-width:100px; text-align:center; padding:8px; background:#f9fafb; border-radius:8px;"
                          :style="{ background: theme === 'dark' ? '#525252' : '#f9fafb' }">
                          <div class="text-xl font-bold" :style="{ color: theme === 'dark' ? '#86efac' : '#22c55e' }">{{ dashFmtBytes(allPeers.reduce((s,p) => s + (p.totalTx||0), 0)) }}</div>
                          <div class="text-xs text-gray-500 dark:text-neutral-400 mt-1">Total Sent</div>
                        </div>
                      </div>
                    </template>

                    <!-- ── nat ── -->
                    <template v-else-if="w.type === 'nat'">
                      <div style="display:flex; flex-direction:column; height:100%; margin:-12px -16px;">

                        <!-- Outbound NAT section -->
                        <div style="padding:6px 12px 4px; flex-shrink:0;">
                          <div style="font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#9ca3af; margin-bottom:4px;">
                            Outbound
                            <span style="font-weight:400; font-size:0.65rem; margin-left:4px;">
                              ({{ natRules.filter(r => r.enabled).length }}/{{ natRules.length }})
                            </span>
                          </div>
                          <div v-if="natRules.length === 0" style="font-size:0.72rem; color:#9ca3af; padding:4px 0;">No rules</div>
                          <div v-for="rule in natRules" :key="rule.id"
                            style="display:flex; align-items:center; gap:6px; padding:3px 0; border-bottom:1px solid #f3f4f6; font-size:0.72rem;"
                            :style="{ 'border-bottom-color': theme==='dark'?'#525252':'#f3f4f6', opacity: rule.enabled ? 1 : 0.5 }">
                            <!-- toggle circle -->
                            <span @click="toggleNatRule(rule)"
                              :title="rule.enabled ? 'Disable' : 'Enable'"
                              style="width:10px; height:10px; border-radius:50%; cursor:pointer; flex-shrink:0; display:inline-block; transition:background 0.2s;"
                              :style="{ background: rule.enabled ? '#16a34a' : '#9ca3af' }"></span>
                            <!-- rule info -->
                            <div style="flex:1; min-width:0; overflow:hidden;">
                              <span style="font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;"
                                :style="{ color: theme==='dark'?'#e5e5e5':'#374151' }">
                                {{ rule.name || rule.outInterface }}
                              </span>
                              <!-- source → outInterface -->
                              <span style="font-size:0.65rem; font-family:monospace; color:#9ca3af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;">
                                <span v-if="rule.sourceAliasId">{{ (aliases.find(a => a.id === rule.sourceAliasId) || {}).name || rule.sourceAliasId }}</span>
                                <span v-else-if="rule.source">{{ rule.source }}</span>
                                <span v-else style="font-style:italic;">any</span>
                                <span style="margin:0 4px; opacity:0.5;">→</span>
                                <span>{{ rule.outInterface }}</span>
                              </span>
                            </div>
                            <!-- type badge -->
                            <span style="flex-shrink:0; font-size:0.6rem; font-weight:600; padding:1px 5px; border-radius:3px;"
                              :style="rule.type === 'MASQUERADE'
                                ? 'background:rgba(99,102,241,0.12); color:#6366f1;'
                                : 'background:rgba(234,179,8,0.12); color:#ca8a04;'">
                              {{ rule.type }}
                            </span>
                            <!-- auto badge -->
                            <span v-if="rule.auto" style="flex-shrink:0; font-size:0.6rem; font-weight:600; padding:1px 5px; border-radius:3px; background:rgba(107,114,128,0.1); color:#9ca3af;">auto</span>
                          </div>
                        </div>

                        <!-- divider -->
                        <div style="height:1px; background:#f3f4f6; flex-shrink:0; margin:0 12px;"
                          :style="{ background: theme==='dark'?'#525252':'#f3f4f6' }"></div>

                        <!-- Port Forwarding (DNAT) section -->
                        <div style="padding:6px 12px 4px; flex:1; overflow-y:auto;">
                          <div style="font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#9ca3af; margin-bottom:4px;">
                            Port Forwarding
                            <span style="font-weight:400; font-size:0.65rem; margin-left:4px;">
                              ({{ dnatRules.filter(r => r.enabled).length }}/{{ dnatRules.length }})
                            </span>
                          </div>
                          <div v-if="dnatRules.length === 0" style="font-size:0.72rem; color:#9ca3af; padding:4px 0;">No rules</div>
                          <div v-for="rule in dnatRules" :key="rule.id"
                            style="display:flex; align-items:center; gap:6px; padding:3px 0; border-bottom:1px solid #f3f4f6; font-size:0.72rem;"
                            :style="{ 'border-bottom-color': theme==='dark'?'#525252':'#f3f4f6', opacity: rule.enabled ? 1 : 0.5 }">
                            <!-- toggle circle -->
                            <span @click="toggleDnat(rule)"
                              :title="rule.enabled ? 'Disable' : 'Enable'"
                              style="width:10px; height:10px; border-radius:50%; cursor:pointer; flex-shrink:0; display:inline-block; transition:background 0.2s;"
                              :style="{ background: rule.enabled ? '#16a34a' : '#9ca3af' }"></span>
                            <!-- rule info -->
                            <div style="flex:1; min-width:0; overflow:hidden;">
                              <span style="font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;"
                                :style="{ color: theme==='dark'?'#e5e5e5':'#374151' }">
                                {{ rule.name || (rule.inPort + ' → ' + rule.dest) }}
                              </span>
                            </div>
                            <!-- proto badge -->
                            <span style="flex-shrink:0; font-size:0.6rem; font-weight:600; padding:1px 5px; border-radius:3px; background:rgba(34,197,94,0.1); color:#16a34a; text-transform:uppercase;">
                              {{ rule.protocol }}
                            </span>
                            <!-- port mapping -->
                            <span style="flex-shrink:0; font-size:0.65rem; font-family:monospace; color:#9ca3af; white-space:nowrap;">
                              :{{ rule.inPort }}→{{ rule.dest }}{{ rule.destPort && rule.destPort !== rule.inPort ? ':' + rule.destPort : '' }}
                            </span>
                          </div>
                        </div>
                      </div>
                    </template>

                    <!-- ── peers (full list with filter + controls) ── -->
                    <template v-else-if="w.type === 'peers'">
                      <!-- expand out of body padding to fill card edge-to-edge -->
                      <div class="dash-peers-panel" style="display:flex; flex-direction:column; height:100%; margin:-12px -16px;">

                        <!-- sticky filter bar -->
                        <div class="dash-peers-toolbar" style="border-bottom:1px solid #f3f4f6; flex-shrink:0;"
                          :style="{ 'border-bottom-color': theme==='dark' ? '#525252' : '#f3f4f6' }">
                          <select v-model="dashPeersGetState(w.id).iface"
                            class="dash-peers-select"
                            style="font-size:0.72rem; border:1px solid #e5e7eb; border-radius:5px; padding:3px 6px; background:transparent; cursor:pointer;"
                            :style="{ 'border-color': theme==='dark' ? '#525252':'#e5e7eb', color: theme==='dark'?'#d4d4d4':'#374151', background: theme==='dark'?'#404040':'#fff' }">
                            <option value="">All peers</option>
                            <option value="__clients__">All clients</option>
                            <option value="__s2s__">All S2S</option>
                            <option v-for="iface in tunnelInterfaces" :key="iface.id" :value="iface.id">{{ iface.name }}</option>
                          </select>
                          <select v-model="dashPeersGetState(w.id).sort"
                            class="dash-peers-select"
                            style="font-size:0.72rem; border:1px solid #e5e7eb; border-radius:5px; padding:3px 6px; background:transparent; cursor:pointer;"
                            :style="{ 'border-color': theme==='dark' ? '#525252':'#e5e7eb', color: theme==='dark'?'#d4d4d4':'#374151', background: theme==='dark'?'#404040':'#fff' }">
                            <option value="name">Sort: Name</option>
                            <option value="traffic">Sort: Traffic</option>
                            <option value="seen">Sort: Last seen</option>
                          </select>
                          <button type="button"
                            @click="dashPeersViewDirty(w.id) ? dashSavePeersView(w.id) : dashResetPeersView(w.id)"
                            class="dash-peers-view-action"
                            :class="{ 'is-dirty': dashPeersViewDirty(w.id) }"
                            :title="dashPeersViewDirty(w.id) ? 'Save filter and sort' : 'Reset filter and sort'">{{ dashPeersViewDirty(w.id) ? 'Save' : 'Reset' }}</button>
                        </div>

                        <!-- scrollable peer list -->
                        <div style="flex:1; overflow-y:auto; padding:0 12px;">
                          <div v-if="dashFilteredPeers(w.id).length === 0"
                            class="text-sm text-gray-400 dark:text-neutral-500"
                            style="padding:16px 0; text-align:center;">
                            No peers
                          </div>
                          <div v-for="peer in dashFilteredPeers(w.id)" :key="peer.id"
                            style="display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid #f3f4f6;"
                            :style="{ 'border-bottom-color': theme==='dark'?'#525252':'#f3f4f6', opacity: peer.enabled ? 1 : 0.55 }">

                            <!-- online status dot -->
                            <span style="width:6px; height:6px; border-radius:50%; flex-shrink:0;"
                              :style="{ background: peer.latestHandshakeAt && (new Date() - new Date(peer.latestHandshakeAt) < 600000) ? '#22c55e' : '#9ca3af' }"></span>

                            <!-- name + address -->
                            <div style="flex:1; min-width:0; overflow:hidden;">
                              <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; font-size:0.75rem;"
                                :style="{ color: theme==='dark'?'#e5e5e5':'#374151' }">
                                {{ peer.name }}
                                <span style="font-size:0.6rem; padding:1px 4px; border-radius:3px; margin-left:3px; font-weight:600;"
                                  :style="{ background: theme==='dark'?'rgba(156,163,175,0.15)':'rgba(107,114,128,0.12)', color: theme==='dark'?'#d1d5db':'#6b7280' }">{{ peer.interfaceName }}</span>
                                <span v-if="peer.peerType === 'interconnect'" style="font-size:0.6rem; padding:1px 4px; background:rgba(59,130,246,0.12); color:#2563eb; border-radius:3px; margin-left:2px; font-weight:600;">S2S</span>
                                <!-- group badge for client peers -->
                                <span v-if="peer.peerType !== 'interconnect' && peerGroupName(peer.groupId)"
                                  style="font-size:0.6rem; padding:1px 4px; border-radius:3px; margin-left:2px; font-weight:600;"
                                  :style="{ background: theme==='dark'?'rgba(34,197,94,0.18)':'rgba(34,197,94,0.1)', color: theme==='dark'?'#4ade80':'#16a34a' }"
                                  :title="'Group: ' + peerGroupName(peer.groupId)">{{ peerGroupName(peer.groupId) }}</span>
                                <!-- handshake time -->
                                <span style="font-size:0.6rem; font-weight:400; margin-left:4px; opacity:0.7; display:inline-flex; align-items:center; gap:2px;"
                                  :title="peer.latestHandshakeAt ? 'Last handshake: ' + new Date(peer.latestHandshakeAt).toLocaleString() : 'Never connected'">
                                  🤝{{ peer.latestHandshakeAt ? dashTimeShort(peer.latestHandshakeAt) : 'Never' }}
                                </span>
                                <!-- expiry badge -->
                                <span v-if="peer.expiredAt"
                                  style="font-size:0.6rem; font-weight:600; padding:1px 4px; border-radius:3px; margin-left:2px;"
                                  :title="'Expires: ' + new Date(peer.expiredAt).toLocaleDateString('ru-RU')"
                                  :style="new Date(peer.expiredAt) < new Date()
                                    ? { background: 'rgba(239,68,68,0.15)', color: '#ef4444' }
                                    : (new Date(peer.expiredAt) - new Date() < 7*24*3600*1000)
                                      ? { background: 'rgba(245,158,11,0.15)', color: theme==='dark'?'#fbbf24':'#d97706' }
                                      : { background: theme==='dark'?'rgba(156,163,175,0.15)':'rgba(107,114,128,0.08)', color: theme==='dark'?'#d1d5db':'#6b7280' }">
                                  ⏰{{ new Date(peer.expiredAt).toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-') }}
                                </span>
                              </div>
                              <div style="font-size:0.65rem; color:#9ca3af; font-family:monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                {{ peer.address || peer.allowedIPs }}
                                <span v-if="peer.runtimeEndpoint" style="margin-left:4px;">· {{ peer.peerType === 'interconnect' ? peer.runtimeEndpoint : peerPublicIP(peer.runtimeEndpoint) }}</span>
                              </div>
                            </div>

                            <!-- traffic -->
                            <div v-if="peer.totalTx || peer.totalRx"
                              style="flex-shrink:0; font-size:0.65rem; font-family:monospace; text-align:right; line-height:1.5;">
                              <div style="color:#ef4444;">↓ {{ dashFmtBytes(peer.totalTx || 0) }}</div>
                              <div style="color:#22c55e;">↑ {{ dashFmtBytes(peer.totalRx || 0) }}</div>
                            </div>

                          </div>
                        </div>
                      </div>
                    </template>

                    <!-- ── monitoring ── -->
                    <template v-else-if="w.type === 'monitoring'">
                      <div v-if="!(w.graphs||[]).length" style="display:flex; align-items:center; justify-content:center; height:60px;">
                        <span class="text-xs text-gray-400 dark:text-neutral-500">Click ⚙ to add graphs</span>
                      </div>
                      <div v-for="key in (w.graphs||[])" :key="key" style="position:relative; margin-bottom:2px;">
                        <span style="position:absolute; top:4px; left:36px; z-index:1; font-size:9px; font-weight:600; pointer-events:none;"
                          :style="{ color: theme==='dark'?'#a3a3a3':'#6b7280' }">{{ metricsKeyLabel(key) }}</span>
                        <!-- Gateway: stacked bar showing proportional status distribution -->
                        <apexchart v-if="key.startsWith('gateway:') && !metricsConfigWidget"
                          type="bar"
                          height="90"
                          :options="{
                            chart: { id: w.id+'_'+key, type:'bar', stacked:true, stackType:'100%', animations:{ enabled:false }, toolbar:{ show:false }, background:'transparent' },
                            plotOptions: { bar: { columnWidth:'95%', borderRadius:0 } },
                            colors: ['#9ca3af','#ef4444','#eab308','#22c55e'],
                            dataLabels: { enabled: false },
                            legend: { show: false },
                            xaxis:  { type:'datetime', labels:{ show: (metricsWidgetPeriod[w.id]||'5m')!=='5m', datetimeUTC:false, style:{ fontSize:'9px', colors: theme==='dark'?'#a3a3a3':'#9ca3af' } }, axisBorder:{ show:false }, axisTicks:{ show:false }, tooltip:{ enabled:false } },
                            yaxis:  { min:0, max:100, labels:{ show:false } },
                            grid:   { borderColor: theme==='dark'?'#404040':'#f0f0f0', padding:{ left:0, right:0, top:0 } },
                            tooltip:{ fixed:{ enabled:true, position:'topRight', offsetX:-12, offsetY:8 }, x:{ format:'HH:mm:ss' }, y:{ formatter: metricsGatewayTooltipFormatter(w.id) }, theme: theme==='dark'?'dark':'light' },
                            theme:  { mode: theme==='dark'?'dark':'light' },
                          }"
                          :series="metricsGetGatewayStackedSeries(w.id, key)"
                        ></apexchart>
                        <!-- Area chart for all other metrics -->
                        <apexchart v-else-if="!metricsConfigWidget"
                          type="area"
                          height="90"
                          :options="metricsAreaChartOptions(w.id, key)"
                          :series="metricsGetCachedAreaSeries(w.id, key)"
                        ></apexchart>
                      </div>
                    </template>

                    <template v-else>
                      <div class="text-sm text-gray-400 dark:text-neutral-500">Unknown widget type: {{ w.type }}</div>
                    </template>

                  </div>
                </div>
              </div>
            </div>
          </div>
          </div><!-- /dashboard-scroll -->
        </div><!-- /activePage === 'dashboard' -->

        <!-- ============================================================== -->
[[ end ]]
