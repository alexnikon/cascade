[[ define "separator-modal" ]]
    <!-- ================================================================ -->
    <!-- Separator add/edit modal                                          -->
    <!-- ================================================================ -->
    <div v-if="showSeparatorModal"
      class="fixed inset-0 bg-black bg-opacity-50 z-50 overflow-y-auto"
      style="padding:40px 24px;" @click.self="showSeparatorModal = false">
      <div class="bg-white dark:bg-neutral-700 rounded-lg" style="max-width:420px; margin:0 auto; padding:24px;">
        <h2 class="text-lg font-bold dark:text-neutral-200" style="margin-bottom:16px;">
          {{ separatorEditId ? 'Edit Separator' : 'Add Separator' }}
        </h2>
        <!-- Name -->
        <div style="margin-bottom:16px;">
          <label class="text-sm font-medium dark:text-neutral-300" style="display:block; margin-bottom:6px;">Name</label>
          <input v-model="separatorEdit.name" type="text" placeholder="Separator name"
            class="w-full rounded-lg text-sm dark:bg-neutral-600 dark:text-neutral-200"
            style="border:1px solid #d1d5db; padding:8px 10px;"
            @keyup.enter="saveSeparator()" />
        </div>
        <!-- Color palette -->
        <div style="margin-bottom:20px;">
          <label class="text-sm font-medium dark:text-neutral-300" style="display:block; margin-bottom:8px;">Color</label>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button v-for="c in separatorColors" :key="c.value"
              @click="separatorEdit.color = c.value"
              :title="c.label"
              style="width:28px; height:28px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:transform 0.1s;"
              :style="{
                background: c.swatch,
                borderColor: separatorEdit.color === c.value ? '#1d4ed8' : 'transparent',
                transform: separatorEdit.color === c.value ? 'scale(1.25)' : 'scale(1)',
              }">
            </button>
          </div>
          <!-- Preview -->
          <div style="margin-top:12px; border-radius:6px; padding:7px 12px; font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;"
            :style="_sepRowStyle(separatorEdit.color)">
            {{ separatorEdit.name || 'Separator' }}
          </div>
        </div>
        <!-- Actions -->
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button @click="showSeparatorModal = false"
            class="text-sm rounded-lg dark:text-neutral-300"
            style="padding:7px 16px; border:1px solid #d1d5db;">
            Cancel
          </button>
          <button @click="saveSeparator()"
            class="text-white text-sm rounded-lg font-medium"
            style="padding:7px 16px; background:#2563eb;">
            {{ separatorEditId ? 'Save' : 'Add' }}
          </button>
        </div>
      </div>
    </div>
[[ end ]]
